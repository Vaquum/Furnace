{% extends "base.html" %}
{% block title %}{{ experiment_id }} · manifest · experiment_runner{% endblock %}
{% block controls %}<span class="topbar-id">{{ experiment_id }} <span class="sub">/ manifest</span></span>{% endblock %}
{% block meta %}
  <button type="button" class="bar-icon" aria-label="Close editor"
          onclick="if (history.length > 1) { history.back(); } else { location.assign('/experiments/{{ experiment_id }}'); }">✕</button>
{% endblock %}
{% block content %}

<div class="manifest-page">
  <div class="manifest-editor">
    <div class="manifest-gutter" aria-hidden="true"></div>
    <div class="manifest-buffer-wrap">
      <pre class="manifest-highlight" aria-hidden="true"></pre>
      <textarea class="manifest-buffer" id="manifest-buffer" spellcheck="false"
                autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off">{{ manifest }}</textarea>
    </div>
  </div>
  <div id="manifest-errors" class="manifest-errors" hidden></div>
  <div class="button-row">
    <button id="manifest-save-btn" type="button" class="primary">Save</button>
    <span id="manifest-status" class="atom-small" style="margin-left: var(--gap-m); align-self: center;"></span>
  </div>
</div>

<script src="/static/manifest_editor.js?v={{ asset_version }}"></script>
<script>
const EXP_ID = {{ experiment_id | tojson }};
let VERSION = {{ version }};
const buffer = document.getElementById('manifest-buffer');
const statusEl = document.getElementById('manifest-status');
const errorsBox = document.getElementById('manifest-errors');

function clearErrors() { errorsBox.hidden = true; errorsBox.textContent = ''; }

function renderErrors(errors) {
  errorsBox.textContent = '';
  for (const e of errors) {
    const row = document.createElement('div');
    row.className = 'manifest-error-row';
    const loc = [];
    if (e.line !== null && e.line !== undefined) loc.push('line ' + e.line);
    if (e.path) loc.push(e.path);
    row.textContent = (loc.length ? '[' + loc.join(' · ') + '] ' : '') + e.message;
    errorsBox.appendChild(row);
  }
  errorsBox.hidden = false;
}

async function saveManifest() {
  const btn = document.getElementById('manifest-save-btn');
  btn.disabled = true;
  statusEl.textContent = 'Saving…'; statusEl.style.color = 'var(--ink-mute)';
  clearErrors();
  let r;
  try {
    r = await fetch(`/experiments/${EXP_ID}/manifest`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ manifest: buffer.value, if_match: VERSION }),
    });
  } catch (e) {
    statusEl.textContent = 'Save failed'; statusEl.style.color = 'var(--negative)';
    btn.disabled = false;
    return;
  }
  if (r.status === 200) {
    VERSION = (await r.json()).version;
    statusEl.textContent = `Saved at version ${VERSION}`;
    statusEl.style.color = 'var(--ink-mute)';
    btn.disabled = false;
    return;
  }
  if (r.status === 409) {
    let d = {};
    try { d = await r.json(); } catch (_) {}
    statusEl.textContent = d.current_version !== undefined
      ? `Conflict — server is at version ${d.current_version}; reload to discard local edits.`
      : 'Conflict';
    statusEl.style.color = 'var(--negative)';
    btn.disabled = false;
    return;
  }
  if (r.status === 400) {
    let d = {};
    try { d = await r.json(); } catch (_) {}
    const detail = d.detail;
    if (detail && detail.kind === 'manifest_invalid' && Array.isArray(detail.errors)) {
      renderErrors(detail.errors);
      statusEl.textContent = `Manifest invalid — ${detail.errors.length} error${detail.errors.length === 1 ? '' : 's'}`;
      statusEl.style.color = 'var(--negative)';
      btn.disabled = false;
      return;
    }
  }
  statusEl.textContent = `Save failed (${r.status})`;
  statusEl.style.color = 'var(--negative)';
  btn.disabled = false;
}

document.getElementById('manifest-save-btn').addEventListener('click', saveManifest);
</script>
{% endblock %}
