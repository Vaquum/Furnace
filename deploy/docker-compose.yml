services:
  furnace:
    image: ${FURNACE_IMAGE:?FURNACE_IMAGE must be set}
    # Run an init process (tini) as PID 1 inside the container. A round runs
    # as `limen run` under a run_round.py supervisor; should limen's own
    # multiprocessing children (e.g. the resource_tracker) outlive their
    # parent they are orphaned onto PID 1, and a bare `python` PID 1 never
    # reaps them. An unreaped zombie keeps the round's process group alive,
    # which leaves the round stuck forever on `terminating`. tini reaps
    # orphans, so the group empties and the round finalizes.
    init: true
    environment:
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME must be set}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      API_SECRET: ${API_SECRET:?API_SECRET must be set}
    ports:
      - "${FURNACE_PORT:-8502}:8502"
    volumes:
      - type: bind
        source: ${FURNACE_HOST_DATA_ROOT:-/data/experiments}
        target: /data/experiments
        read_only: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
