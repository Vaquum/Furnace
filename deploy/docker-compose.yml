services:
  furnace:
    image: ${FURNACE_IMAGE:?FURNACE_IMAGE must be set}
    # Run an init process (tini) as PID 1 inside the container. A round runs
    # as `limen run` under a run_round.py supervisor; should limen's own
    # multiprocessing children (e.g. the resource_tracker) outlive their
    # parent they are orphaned onto PID 1, and a bare `python` PID 1 never
    # reaps them. An unreaped zombie keeps the round's process group alive,
    # which leaves the round stuck forever on `terminating`. tini reaps
    # orphans, so the group empties and the round finalizes.
    init: true
    environment:
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME must be set}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      API_SECRET: ${API_SECRET:?API_SECRET must be set}
      # Max rounds in pending/running/terminating across ALL experiments
      # before POST /experiments/{id}/rounds answers 409. One `limen run`
      # already parallelizes to the box; raise deliberately, not by default.
      FURNACE_MAX_ACTIVE_ROUNDS: ${FURNACE_MAX_ACTIVE_ROUNDS:-1}
    ports:
      - "${FURNACE_PORT:-8502}:8502"
    volumes:
      - type: bind
        source: ${FURNACE_HOST_DATA_ROOT:-/data/experiments}
        target: /data/experiments
        read_only: false
      # The tdw Arrow bar store, mounted read-only so rounds can run Limen
      # manifests whose data_source is HistoricalData.get_arrow_file with a
      # /opt/arrow/<series>/latest.arrow path. read_only:true means Furnace
      # can never write back into the shared store; the volume is external
      # (declared below), so this compose never creates or deletes it.
      - type: volume
        source: arrow
        target: /opt/arrow
        read_only: true
      # The Conduit prediction store, mounted read-write: Furnace WRITES the
      # per-series prediction Arrow files here (/opt/conduit/<series>/latest.arrow)
      # and same-host consumers read them zero-copy. This is the producer-side
      # mirror of the read-only /opt/arrow mount above. The volume is external
      # (declared below) and owned by Furnace; external:true keeps this compose
      # from creating or removing it, so a teardown never destroys served data.
      - type: volume
        source: conduit
        target: /opt/conduit
        read_only: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  furnace-scheduler:
    image: ${FURNACE_IMAGE:?FURNACE_IMAGE must be set}
    init: true
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    command: ["python", "-m", "furnace", "--root", "/data/experiments", "--scheduler"]
    volumes:
      - type: bind
        source: ${FURNACE_HOST_DATA_ROOT:-/data/experiments}
        target: /data/experiments
        read_only: false
      - type: volume
        source: arrow
        target: /opt/arrow
        read_only: true
      - type: volume
        source: conduit
        target: /opt/conduit
        read_only: false
    restart: unless-stopped

volumes:
  # External: the Arrow bar store volume is created and written by the
  # tdw-control-plane stack on the same host; Furnace only references it.
  # external:true keeps this compose from creating or removing it, so a
  # teardown of the Furnace project never touches the shared store.
  arrow:
    external: true
    name: ${ARROW_VOLUME_NAME:-tdw-control-plane_arrow}
  # External: the Conduit prediction store volume, owned by Furnace (it is the
  # producer). external:true keeps this compose from creating or removing it,
  # so a teardown of the Furnace project never deletes served predictions; the
  # volume is provisioned out-of-band (e.g. `docker volume create`) and read by
  # same-host consumers. read-write on the furnace mount above so Furnace can
  # write the per-series prediction Arrow files.
  conduit:
    external: true
    name: ${CONDUIT_VOLUME_NAME:-furnace_conduit}
